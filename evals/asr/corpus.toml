# Manifest contract: checked-in metadata only; audio stays gitignored and local.
# Public baseline provenance is documented in evals/AGENTS.md; these entries are
# placeholders for manually recorded product-domain samples.
# 持续性真实音频评估清单。
# 音频本体放 evals/asr/corpus/<scenario>/，被 .gitignore 排除；不要提交录音。
# 每个文件必须由人工录音并人工校对 transcript，不能用合成音/识别结果冒充 ground truth。

default_max_cer = 0.15

[[sample]]
file = "corpus/coding/short-rust.wav"
scenario = "coding"
lang = "zh"
tags = ["short", "technical"]
transcript = "写一个 Rust 函数"
max_cer = 0.20

