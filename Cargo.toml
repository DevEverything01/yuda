[package]
name = "yuda"
version = "0.1.0"
edition = "2021"
description = "中文优先的 Wayland 语音输入 daemon"
license = "MIT"

[features]
default = []
# Enables the official sherpa-onnx native runtime for SenseVoice-Small.
sensevoice = ["dep:sherpa-onnx"]
# Enables the Linux input/audio runtime used by the daemon.
linux-runtime = ["dep:cpal", "dep:evdev"]
daemon = ["linux-runtime", "sensevoice"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
cpal = { version = "0.15", optional = true }
evdev = { version = "0.12", optional = true }
sherpa-onnx = { version = "1.13.5", optional = true, default-features = false, features = ["static"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
