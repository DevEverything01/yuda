# 语打 Yuda 配置 —— ~/.config/yuda/config.toml（权限 0600，安装与升级不会覆盖）
# 修改后运行 `yuda reload`，或在 Omarchy 菜单 Setup › Yuda 语打 中切换。

engine = "auto"     # auto：云端优先，2 秒连不上自动用离线；cloud：只用云端；offline：只用离线
language = "zh"     # zh 中文（中英混输）/ en / yue 粤语 / ja / ko

[trigger]
# omarchy：由 Omarchy 听写快捷键驱动（按住 Right Alt 或 F9，Super+Ctrl+X 切换），无需 input 组。
# evdev：语打自己监听按键（非 Omarchy 的 Hyprland），需要 `sudo usermod -aG input $USER` 后重新登录。
source = "omarchy"
evdev_key = "KEY_RIGHTCTRL"   # 仅 evdev 模式使用；evdev 键名，例如 KEY_RIGHTALT、KEY_F9
min_hold_ms = 300             # 按住短于此时长视为误触
max_recording_secs = 300      # 单次录音上限

[cloud]
# 火山引擎 · 豆包语音识别大模型（与豆包输入法同款），约 ¥2.2/小时。
# 控制台：https://console.volcengine.com/speech/app
# 旧版控制台：app_key 填 APP ID，access_key 填 Access Token。
# 新版控制台只有一个 API Key：app_key 留空，access_key 填 API Key。
app_key = ""
access_key = ""
resource_id = "volc.bigasr.sauc.duration"   # 并发版用 volc.bigasr.sauc.concurrent
endpoint = "wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_async"
connect_timeout_ms = 2000

[offline]
# 本地离线模型（omarchy-install-dictation-yuda 自动下载并校验）
model_dir = "~/.local/share/yuda/models"
# 中文（中英混输）与英文：zipformer 中英模型，技术名词识别好、速度快
model = "sherpa-onnx-x-asr-zipformer-transducer-zh-en-punct-int8-2026-06-03"
# 粤语、日语、韩语：SenseVoice-Small
multilingual_model = "sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17"
vad_model = "silero_vad.onnx"   # 边说边出字所需；缺失时退化为松手后整段识别
num_threads = 2
use_itn = true                  # SenseVoice 自带的数字规整

[text]
remove_fillers = true           # 去掉「嗯、呃」等语气词（不影响「额外」「好啊」）
fix_term_case = true            # 技术名词规范写法：python → Python、json → JSON、mac book → MacBook
itn = true                      # 时间日期写成数字：「下午三点」→「下午3点」（「有一点」不受影响）
cjk_spacing = false             # 中英之间加空格：true →「用 Python 写」，false →「用Python写」
hotwords = []                   # 云端热词，例如 ["Omarchy", "Hyprland"]

[text.replacements]
# 个人词库：识别结果中左边的文本替换为右边
# "配森" = "Python"
# "杰森" = "JSON"

[llm]
# AI 纠错：只修同音字与被误识别成中文的英文术语，绝不改写；超时直接上屏原文。
enabled = false
api_base = ""                   # 任意 OpenAI 兼容端点，例如 https://api.openai.com/v1
api_key = ""                    # 可以留空
model = "gpt-4o-mini"
timeout_ms = 5000

[injection]
paste_delay_ms = 200            # 粘贴后等待目标应用读取剪贴板，再恢复原剪贴板
auto_paste = true               # false：只复制到剪贴板，不模拟粘贴

[history]
enabled = true                  # 本机 ~/.local/state/yuda/history.jsonl（0600），用于「重新上屏」
max_entries = 200
