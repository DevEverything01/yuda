name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # 手动触发时连 Omarchy 真机层一起跑
  schedule:
    - cron: "17 2 * * *" # 每日夜间 UTC 02:17；真机层不阻塞 PR

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 分层对应 docs/testing.md：
#   hosted 层 = T0 + T1（默认 features / linux-runtime），每次 PR 必过
#   kvm 层 = Omarchy 官方 VM 镜像中的全自动端到端验收（ADR 0008），仅手动/夜间触发，不阻塞 PR
#   omarchy 层 = ASR 准确性评估（需真人语料），仅手动/夜间触发，不阻塞 PR
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  default-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  linux-runtime:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: 安装工具链（checkout 需要 git，cpal 需要 alsa）
        run: pacman -Syu --noconfirm --needed base-devel git rust alsa-lib
      - uses: actions/checkout@v4
      - name: 缓存 target（sherpa-onnx 之外也省时间）
        uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --features linux-runtime,cloud,llm --all-targets -- -D warnings
      - run: cargo test --locked --features linux-runtime,cloud,llm

  # 需要：在带 /dev/kvm 的 Linux 宿主机上注册 self-hosted runner（label 含 "kvm"），
  # 并安装 qemu-system-x86、qemu-img、socat、jq、curl。见 docs/adr/0008-omarchy-vm-e2e.md。
  omarchy-vm-e2e:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 60
    runs-on: [self-hosted, kvm]
    steps:
      - uses: actions/checkout@v4
      - name: 获取 Omarchy edge VM 镜像（已是最新则只校验）
        run: scripts/omarchy-vm fetch
      - name: 在 Omarchy VM 中构建、安装并跑端到端场景
        run: scripts/omarchy-e2e
      - name: 上传截图与 daemon 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuda-omarchy-e2e-${{ github.run_id }}
          path: target/e2e
          if-no-files-found: warn

  # ASR 准确性评估：需要已登录的 Omarchy 机器与本机真人语料（ADR 0006 第 3 条）。
  asr-evals:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 30
    runs-on: [self-hosted, omarchy]
    env:
      YUDA_ASR_CONFIG: ${{ vars.YUDA_ASR_CONFIG }}
      YUDA_ASR_MANIFEST: ${{ vars.YUDA_ASR_MANIFEST }}
      YUDA_ASR_ENABLE_FILE: ${{ vars.YUDA_ASR_ENABLE_FILE }}
      YUDA_ASR_MODEL_DIR: ${{ vars.YUDA_ASR_MODEL_DIR }}
    steps:
      - uses: actions/checkout@v4
      - name: 检查本机 ASR 语料是否已启用
        id: asr-corpus
        run: |
          set -euo pipefail
          manifest="${YUDA_ASR_MANIFEST:-evals/asr/corpus.toml}"
          marker="${YUDA_ASR_ENABLE_FILE:-$HOME/.config/yuda/asr-evals.enabled}"
          report="$RUNNER_TEMP/yuda-asr-report.md"
          if [[ -f "$manifest" && -f "$marker" ]]; then
            printf 'available=true\nmanifest=%s\nreport=%s\n' "$manifest" "$report" >>"$GITHUB_OUTPUT"
          else
            printf 'available=false\nmanifest=%s\nreport=%s\n' "$manifest" "$report" >>"$GITHUB_OUTPUT"
            printf '::warning::未找到已启用的 ASR 真实语料，跳过准确性评估（manifest=%s marker=%s）\n' "$manifest" "$marker"
          fi
      - name: ASR 多场景准确性评估
        if: steps.asr-corpus.outputs.available == 'true'
        env:
          YUDA_ASR_MANIFEST: ${{ steps.asr-corpus.outputs.manifest }}
          YUDA_ASR_REPORT: ${{ steps.asr-corpus.outputs.report }}
        run: cargo test --locked --features sensevoice --test asr_accuracy -- --ignored --nocapture
      - name: 上传 ASR 评估报告
        if: always() && steps.asr-corpus.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: yuda-asr-report-${{ github.run_id }}
          path: ${{ steps.asr-corpus.outputs.report }}
          if-no-files-found: warn
